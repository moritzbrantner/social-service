name: Materialize conventions

on:
  push:
    branches:
      - chore/reproducible-foundation

permissions:
  contents: write

jobs:
  conventions:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Fetch pinned landscape sources
        run: |
          mkdir -p .tmp
          git clone --quiet https://github.com/moritzbrantner/coding-tooling.git .tmp/coding-tooling
          git -C .tmp/coding-tooling checkout --quiet 28307c66f40e6f02012ed06cc6a632b8b4b15434
          git clone --quiet https://github.com/moritzbrantner/coding-agent-conventions.git .tmp/coding-agent-conventions
          git -C .tmp/coding-agent-conventions checkout --quiet 8a6bd286b108a0be889073cc22698dd8add8c50b
          bun install --cwd .tmp/coding-tooling --frozen-lockfile
      - name: Materialize selected convention modules
        run: |
          bun .tmp/coding-tooling/src/entry.ts conventions init rust typescript postgres docker security \
            --profile foundation \
            --root . \
            --conventions-root .tmp/coding-agent-conventions \
            --registry .tmp/coding-agent-conventions/registry/registry.json \
            --json
          rm -rf .tmp
      - name: Commit convention snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conventions.json conventions.lock.json .conventions
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: materialize coding-agent conventions"
          git push origin HEAD:chore/reproducible-foundation
