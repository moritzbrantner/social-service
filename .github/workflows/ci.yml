name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features

  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: social
          POSTGRES_USER: social
          POSTGRES_PASSWORD: social
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U social -d social"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      DATABASE_URL: postgres://social:social@localhost:5432/social
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --locked --tests -- --ignored --nocapture

  typescript:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  landscape:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: sdk/typescript
      - name: Run strict full tier
        uses: moritzbrantner/coding-tooling@1ca87e2982c30cf29b813b0e6309219642f65b3f
        with:
          operation: run
          tier: full
          strict: "true"
          install-mode: none
          report-path: .artifacts/coding-tooling/full.json

      - name: Verify exact HTTP behavioral cases
        uses: moritzbrantner/coding-tooling@1ca87e2982c30cf29b813b0e6309219642f65b3f
        with:
          operation: public-contract
          install-mode: none
          report-path: .artifacts/coding-tooling/http-contract.json

      - name: Detect structural validation changes
        id: structure
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi

          changed=false
          while IFS= read -r path; do
            case "$path" in
              .coding-tooling.json|.coding-tooling.expectations.json|.coding-tooling.dependencies.json|.coding-tooling.source-deps.json|.repository-environment.toml|AGENTS.md|renovate.json|package.json|bun.lock|package-lock.json|pnpm-lock.yaml|yarn.lock|rust-toolchain.toml|Cargo.toml|Cargo.lock|Dockerfile*|docker-compose*.yml|compose*.yml|tsconfig*.json|scripts/codex-environment.sh|.github/dependabot.yml|.github/workflows/*|.github/actions/*|.conventions/*|.devcontainer/*|*/Cargo.toml|*/Cargo.lock|*/package.json|*/tsconfig*.json)
                changed=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" HEAD)

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Check convention conformance
        if: steps.structure.outputs.changed == 'true'
        uses: moritzbrantner/coding-tooling@1ca87e2982c30cf29b813b0e6309219642f65b3f
        with:
          operation: conformance
          report-path: .artifacts/coding-tooling/conformance.json

  load-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: sdk/typescript
      - name: Install declared profiler source
        run: cargo install --git https://github.com/moritzbrantner/runtime-profiler.git --rev 7ba8e3a9a80ed4911f49a07b4b4848945f6e6fdb --locked --root .artifacts/tools/runtime-profiler
      - name: Expose installed collector
        run: echo "$PWD/.artifacts/tools/runtime-profiler/bin" >> "$GITHUB_PATH"
      - name: Acquire locked service dependencies
        run: cargo fetch --locked
      - name: Acquire pinned database image
        run: docker compose pull postgres
      - name: Run real-service acceptance and failure cases
        run: python3 scripts/test_load_smoke.py
      - name: Invoke declared performance capability
        uses: moritzbrantner/coding-tooling@1ca87e2982c30cf29b813b0e6309219642f65b3f
        with:
          operation: run
          tier: performance
          strict: "true"
          install-mode: none
          report-path: .artifacts/coding-tooling/load-smoke.json
      - name: Upload measurement and validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: social-service-load-smoke
          path: |
            .artifacts/load-smoke
            .artifacts/coding-tooling/load-smoke.json
          if-no-files-found: error
