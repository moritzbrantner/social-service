name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validation-scope:
    runs-on: ubuntu-latest
    outputs:
      validate-pages: ${{ steps.scope.outputs.validate-pages }}
      allow-skipped: ${{ steps.scope.outputs.allow-skipped }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - id: scope
        shell: python
        run: |
          import fnmatch
          import json
          import os
          import subprocess
          scopes = {'validate-pages': {'paths': ['pages/**', '.github/workflows/pages.yml', '.github/workflows/ci.yml'], 'branches': []}}
          selected = {job: False for job in scopes}
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              with open(os.environ["GITHUB_EVENT_PATH"]) as source:
                  pull_request = json.load(source)["pull_request"]
              revision = pull_request["base"]["sha"] + "..." + pull_request["head"]["sha"]
              paths = subprocess.check_output(["git", "diff", "--no-renames", "--name-only", "-z", revision]).decode().split("\0")
              selected = {
                  job: (not rule["paths"] or any(fnmatch.fnmatchcase(path, pattern) for path in paths for pattern in rule["paths"]))
                  and (not rule["branches"] or any(fnmatch.fnmatchcase(pull_request["base"]["ref"], branch) for branch in rule["branches"]))
                  for job, rule in scopes.items()
              }
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for job, active in selected.items():
                  print(f"{job}={str(active).lower()}", file=output)
              print(f"allow-skipped={json.dumps([job for job, active in selected.items() if not active])}", file=output)

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features

  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
        env:
          POSTGRES_DB: social
          POSTGRES_USER: social
          POSTGRES_PASSWORD: social
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U social -d social"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      DATABASE_URL: postgres://social:social@localhost:5432/social
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --locked --tests -- --ignored --nocapture

  typescript:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  landscape:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: sdk/typescript
      - name: Run strict full tier
        uses: moritzbrantner/coding-tooling@1ca87e2982c30cf29b813b0e6309219642f65b3f
        with:
          operation: run
          tier: full
          strict: "true"
          install-mode: none
          report-path: .artifacts/coding-tooling/full.json

      - name: Verify exact HTTP behavioral cases
        uses: moritzbrantner/coding-tooling@1ca87e2982c30cf29b813b0e6309219642f65b3f
        with:
          operation: public-contract
          install-mode: none
          report-path: .artifacts/coding-tooling/http-contract.json

      - name: Detect structural validation changes
        id: structure
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi

          changed=false
          while IFS= read -r path; do
            case "$path" in
              .coding-tooling.json|.coding-tooling.expectations.json|.coding-tooling.dependencies.json|.coding-tooling.source-deps.json|.repository-environment.toml|AGENTS.md|renovate.json|package.json|bun.lock|package-lock.json|pnpm-lock.yaml|yarn.lock|rust-toolchain.toml|Cargo.toml|Cargo.lock|Dockerfile*|docker-compose*.yml|compose*.yml|tsconfig*.json|scripts/codex-environment.sh|.github/dependabot.yml|.github/workflows/*|.github/actions/*|.conventions/*|.devcontainer/*|*/Cargo.toml|*/Cargo.lock|*/package.json|*/tsconfig*.json)
                changed=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" HEAD)

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Check convention conformance
        if: steps.structure.outputs.changed == 'true'
        uses: moritzbrantner/coding-tooling@1ca87e2982c30cf29b813b0e6309219642f65b3f
        with:
          operation: conformance
          report-path: .artifacts/coding-tooling/conformance.json

  load-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: sdk/typescript
      - name: Install declared profiler source
        run: cargo install --git https://github.com/moritzbrantner/runtime-profiler.git --rev 7ba8e3a9a80ed4911f49a07b4b4848945f6e6fdb --locked --root .artifacts/tools/runtime-profiler
      - name: Expose installed collector
        run: echo "$PWD/.artifacts/tools/runtime-profiler/bin" >> "$GITHUB_PATH"
      - name: Acquire locked service dependencies
        run: cargo fetch --locked
      - name: Acquire pinned database image
        run: docker compose pull postgres
      - name: Run real-service acceptance and failure cases
        run: python3 scripts/test_load_smoke.py
      - name: Invoke declared performance capability
        uses: moritzbrantner/coding-tooling@1ca87e2982c30cf29b813b0e6309219642f65b3f
        with:
          operation: run
          tier: performance
          strict: "true"
          install-mode: none
          report-path: .artifacts/coding-tooling/load-smoke.json
      - name: Upload measurement and validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: social-service-load-smoke
          path: |
            .artifacts/load-smoke
            .artifacts/coding-tooling/load-smoke.json
          if-no-files-found: error

  validate-pages:
    needs: validation-scope
    if: github.event_name == 'pull_request' && needs.validation-scope.outputs.validate-pages == 'true'
    permissions:
      actions: read
      contents: read
      packages: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  merge-ready:
    name: ${{ github.event_name == 'pull_request' && 'merge-ready' || 'validation-summary' }}
    if: ${{ always() }}
    needs: ["rust", "database", "typescript", "landscape", "load-smoke", "validate-pages", "validation-scope"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["rust", "database", "typescript", "landscape", "load-smoke", "validate-pages", "validation-scope"]'
          allow-skipped: ${{ needs.validation-scope.outputs.allow-skipped || '[]' }}
