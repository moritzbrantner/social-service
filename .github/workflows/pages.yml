name: Deploy Pages Showcase

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  pages: write
  id-token: write

jobs:
  pages-preflight:
    name: Pages preflight
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check repository Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/pages.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")"
          case "$status" in
            200) echo "enabled=true" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "Enable Settings → Pages → Build and deployment → Source: GitHub Actions once." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) cat /tmp/pages.json >&2 || true; exit 1 ;;
          esac

  deploy-pages:
    name: Deploy showcase
    needs: pages-preflight
    if: ${{ needs.pages-preflight.outputs.enabled == 'true' }}
    uses: moritzbrantner/reusable-workflows/.github/workflows/deploy-pages.yml@197a252fcfc3d4a631010c61ef77369f5461365c
    with:
      working_directory: "."
      node_version: "24"
      bun_version: ""
      install_command: ""
      pre_command: "node --test ./pages/tests/showcase.test.mjs"
      build_command: "node ./pages/build.mjs"
      artifact_path: "pages/dist"
      cache_bun: false
      cache_node: false
