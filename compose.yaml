services:
  postgres:
    image: postgres:17.12-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    environment:
      POSTGRES_DB: social
      POSTGRES_USER: social
      POSTGRES_PASSWORD: social
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social -d social"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - social-postgres:/var/lib/postgresql/data

volumes:
  social-postgres:
