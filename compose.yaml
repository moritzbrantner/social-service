services:
  postgres:
    image: postgres:17.12-alpine@sha256:34261f594522cf41dfcb76aefd42b9d201098b0e6b23c9c68733f169e4218b6f
    environment:
      POSTGRES_DB: social
      POSTGRES_USER: social
      POSTGRES_PASSWORD: social
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social -d social"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - social-postgres:/var/lib/postgresql/data

volumes:
  social-postgres:
