services:
  postgres:
    image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: social
      POSTGRES_USER: social
      POSTGRES_PASSWORD: social
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social -d social"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - social-postgres:/var/lib/postgresql/data

volumes:
  social-postgres:
