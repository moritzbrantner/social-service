services:
  postgres:
    image: postgres:17.11-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
    environment:
      POSTGRES_DB: social
      POSTGRES_USER: social
      POSTGRES_PASSWORD: social
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social -d social"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - social-postgres:/var/lib/postgresql/data

volumes:
  social-postgres:
